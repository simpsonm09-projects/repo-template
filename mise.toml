# Tools for the template. `flint init` reconciles the linter pins under the
# Linters header. See https://github.com/simpsonm09-projects/repo-standard/blob/main/docs/linting.md

[tools]

# Task runner
"aqua:casey/just" = "1.59.0"

"aqua:evilmartians/lefthook" = "2.2.2"
"aqua:gitleaks/gitleaks" = "8.30.1"
"aqua:gradle/gradle" = "9.1.0"
"aqua:koalaman/shellcheck" = "0.11.0"
"aqua:pinterest/ktlint" = "1.5.0"

# CI linters
"aqua:rhysd/actionlint" = "1.7.12"
"aqua:zizmorcore/zizmor" = "1.30.1"

# Complexity. Pin the CLI zip explicitly: asset autodetection picks the bare
# -all.jar on Linux, which exposes no `bin/detekt` executable.
"github:detekt/detekt" = { version = "1.23.8", asset_pattern = "detekt-cli-{{ version }}.zip", rename_exe = { "detekt-cli" = "detekt", "detekt-cli.bat" = "detekt.bat" } }

# JVM toolchain
java = "temurin-25"

# Node runs the repository scripts and the aislop gate.
node = "26.13.1"

# AI-slop gate, pinned so CI resolves no version at run time (C7.2).
"npm:aislop" = "0.16.1"

# Linters
"aqua:grafana/flint" = "0.22.14"

[env]
FLINT_CONFIG_DIR = ".github/config"

[tasks.lint]
description = "Run all lints"
run = "flint run"

[tasks."lint:fix"]
description = "Auto-fix lint issues"
run = "flint run --fix"

[tasks.test]
description = "Run the tests"
run = "gradle test"
