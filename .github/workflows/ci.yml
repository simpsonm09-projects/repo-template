name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fmt:
    if: github.repository_owner == 'simpsonm09-projects'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install pinned tools
        uses: jdx/mise-action@924e7c586e33d7d4bae9c14e26c5d22e2beb6e78 # v5.3.0
      - name: Check formatting
        run: just fmt-check
  hooks:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install pinned tools
        uses: jdx/mise-action@924e7c586e33d7d4bae9c14e26c5d22e2beb6e78 # v5.3.0
      - name: Fetch the shared hook config
        # `install` fetches the public `hooks-v3` tag into
        # `.git/info/lefthook-remotes`; `validate` alone silently skips remotes.
        run: lefthook install
      - name: Assert the merged config
        run: |
          dump=$(lefthook dump)
          for job in core-fmt core-forbidden-files core-policy owner-signing; do
            grep -q "name: $job" <<<"$dump" || {
              echo "::error::the shared hook config did not load job $job"
              exit 1
            }
          done
      - name: Validate hook config
        run: lefthook validate
      # The required checks are the recipes the hooks run (C5.7). These four
      # only ever run from a hook, so this job is where CI confirms them.
      - name: Confirm the hook recipes
        run: |
          just agent-files
          git ls-files -z | xargs -0 -r just forbidden-files
          just workflows
          git ls-files -z -- '*.sh' '*.bash' | xargs -0 -r just shellcheck

  lint:
    if: github.repository_owner == 'simpsonm09-projects'
    uses: simpsonm09-projects/repo-standard/.github/workflows/lint.yml@60a4eea1170f97ac967c4224ee4ee58ce3959c3d # repo-standard, pinned commit
  aislop:
    if: github.repository_owner == 'simpsonm09-projects'
    permissions:
      contents: read
      security-events: write
    uses: simpsonm09-projects/repo-standard/.github/workflows/aislop.yml@60a4eea1170f97ac967c4224ee4ee58ce3959c3d # repo-standard, pinned commit
  security:
    if: github.repository_owner == 'simpsonm09-projects'
    permissions:
      contents: read
      security-events: write
    uses: simpsonm09-projects/repo-standard/.github/workflows/security.yml@60a4eea1170f97ac967c4224ee4ee58ce3959c3d # repo-standard, pinned commit
  standard:
    if: github.repository_owner == 'simpsonm09-projects'
    permissions:
      contents: read
    uses: simpsonm09-projects/repo-standard/.github/workflows/standard.yml@60a4eea1170f97ac967c4224ee4ee58ce3959c3d # repo-standard, pinned commit
  coverage:
    if: github.repository_owner == 'simpsonm09-projects'
    permissions:
      contents: read
    uses: simpsonm09-projects/repo-standard/.github/workflows/coverage.yml@60a4eea1170f97ac967c4224ee4ee58ce3959c3d # repo-standard, pinned commit
    with:
      # The coverage job runs on its own runner; restore the same package
      # cache the other jobs use instead of rebuilding (C5.2).
      cache_path: |
        ~/.gradle/caches
        ~/.gradle/wrapper
      cache_key: gradle
      cache_hash_files: |
        **/*.gradle*
        **/gradle-wrapper.properties


  test:
    if: github.repository_owner == 'simpsonm09-projects'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install pinned tools
        uses: jdx/mise-action@924e7c586e33d7d4bae9c14e26c5d22e2beb6e78 # v5.3.0
      - name: Restore the Gradle cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            gradle-${{ runner.os }}-
      - name: Test
        run: just test
      - name: Test the Dependabot summary workflow
        run: just test-workflow
      - name: Check the API document
        run: |
          just spec
          git diff --exit-code -- docs/openapi.json
