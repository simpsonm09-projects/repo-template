name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fmt:
    if: github.repository_owner == 'simpsonm09-projects'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install pinned tools
        uses: jdx/mise-action@9b200bcecbfd6303e69a4a261b2e09e3757440a7 # v5.2.0
      - name: Check formatting
        run: just fmt-check
  hooks:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      # This job runs lefthook and nothing else, so it installs one tool
      # instead of the whole pinned set (C5.2).
      MISE_NOT_FOUND_AUTO_INSTALL: "false"
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install pinned tools
        uses: jdx/mise-action@9b200bcecbfd6303e69a4a261b2e09e3757440a7 # v5.2.0
        with:
          install_args: aqua:evilmartians/lefthook
      - name: Fetch the shared hook config
        run: lefthook install
      - name: Assert the merged config
        run: |
          dump=$(lefthook dump)
          for job in core-fmt core-forbidden-files core-policy owner-signing; do
            grep -q "name: $job" <<<"$dump" || {
              echo "::error::the shared hook config did not load job $job"
              exit 1
            }
          done
      - name: Validate hook config
        run: lefthook validate

  lint:
    if: github.repository_owner == 'simpsonm09-projects'
    uses: simpsonm09-projects/repo-standard/.github/workflows/lint.yml@0f3a767985d84ed9baec257d97ea21b2df8f79ba # repo-standard, pinned commit
  aislop:
    if: github.repository_owner == 'simpsonm09-projects'
    permissions:
      contents: read
      security-events: write
    uses: simpsonm09-projects/repo-standard/.github/workflows/aislop.yml@0f3a767985d84ed9baec257d97ea21b2df8f79ba # repo-standard, pinned commit
  security:
    if: github.repository_owner == 'simpsonm09-projects'
    permissions:
      contents: read
      security-events: write
    uses: simpsonm09-projects/repo-standard/.github/workflows/security.yml@0f3a767985d84ed9baec257d97ea21b2df8f79ba # repo-standard, pinned commit
  standard:
    if: github.repository_owner == 'simpsonm09-projects'
    permissions:
      contents: read
    uses: simpsonm09-projects/repo-standard/.github/workflows/standard.yml@0f3a767985d84ed9baec257d97ea21b2df8f79ba # repo-standard, pinned commit
  coverage:
    if: github.repository_owner == 'simpsonm09-projects'
    permissions:
      contents: read
    uses: simpsonm09-projects/repo-standard/.github/workflows/coverage.yml@0f3a767985d84ed9baec257d97ea21b2df8f79ba # repo-standard, pinned commit
    with:
      # The coverage job runs on its own runner; restore the same package
      # cache the other jobs use instead of rebuilding (C5.2).
      cache_path: |
        ~/.gradle/caches
        ~/.gradle/wrapper
      cache_key: gradle
      cache_hash_files: |
        **/*.gradle*
        **/gradle-wrapper.properties


  test:
    if: github.repository_owner == 'simpsonm09-projects'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install pinned tools
        uses: jdx/mise-action@9b200bcecbfd6303e69a4a261b2e09e3757440a7 # v5.2.0
      - name: Restore the Gradle cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            gradle-${{ runner.os }}-
      - name: Test
        run: just test
      - name: Test the Dependabot summary workflow
        run: just test-workflow
      - name: Check the API document
        run: |
          just spec
          git diff --exit-code -- docs/openapi.json
