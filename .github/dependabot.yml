# Dependency updates come from Dependabot. Dependabot has no shareable preset, so
# this file lives in each repository. Keep the shape the standard checks. See
# docs/automation.md.

version: 2
updates:
  - package-ecosystem: "gradle"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "Etc/UTC"
    cooldown:
      default-days: 3
      semver-minor-days: 7
      semver-major-days: 14
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(deps)"
    labels: ["dependencies"]
    groups:
      non-major:
        patterns: ["*"]
        update-types: ["minor", "patch"]
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "Etc/UTC"
    cooldown:
      default-days: 3
      semver-minor-days: 7
      semver-major-days: 14
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(actions)"
    labels: ["dependencies"]
    groups:
      non-major:
        patterns: ["*"]
        update-types: ["minor", "patch"]
